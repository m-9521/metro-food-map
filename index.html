<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>北京地铁美食地图</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{background:#eef2f6;color:#15202b}
button,input{font:inherit;color:inherit}

/* ---------- 登录门 ---------- */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 18% 12%,#123a5c 0%,#0b1f33 45%,#07131f 100%);transition:opacity .35s}
#gate.out{opacity:0;pointer-events:none}
.gateArt{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.card{position:relative;width:min(400px,88vw);padding:34px 30px 28px;border-radius:18px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);
  box-shadow:0 24px 60px rgba(0,0,0,.45);color:#eef4fa}
.card h1{margin:0 0 6px;font-size:22px;letter-spacing:.5px}
.card .sub{margin:0 0 22px;font-size:13px;line-height:1.7;color:#a9c2d8}
.card input{display:block;width:100%;padding:13px 15px;border-radius:11px;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:16px;outline:none}
.card input:focus{border-color:#59b9ff;box-shadow:0 0 0 3px rgba(89,185,255,.22)}
.card input::placeholder{color:#8fa9bf}
.card button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:11px;cursor:pointer;
  background:linear-gradient(180deg,#3fa9f5,#1f7fd0);color:#fff;font-size:16px;font-weight:600}
.card button:active{transform:translateY(1px)}
#gateErr{min-height:19px;font-size:13px;color:#ffb4a8;margin-top:8px}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.lockNote{margin:16px 0 0;font-size:11.5px;line-height:1.6;color:#7f9bb2}

/* ---------- 主界面 ---------- */
#app{display:flex;flex-direction:column;height:100%}
header{flex:0 0 auto;background:#fff;border-bottom:1px solid #dfe5ea;box-shadow:0 1px 3px rgba(20,40,60,.06);z-index:20}
.topRow{display:flex;align-items:center;gap:10px;padding:9px 14px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
#sum{display:block;font-weight:400;color:#6a7a89;font-size:11.5px;margin-top:2px;white-space:normal}
.searchBox{flex:1 1 170px;max-width:270px;position:relative}
.searchBox input{width:100%;padding:8px 11px 8px 30px;border-radius:9px;border:1px solid #cfd8e0;background:#fff;font-size:13.5px;outline:none}
.searchBox input:focus{border-color:#2f8fd6;box-shadow:0 0 0 3px rgba(47,143,214,.15)}
.searchBox>svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:.45}
.btn{padding:7px 12px;border-radius:9px;border:1px solid #cfd8e0;background:#fff;cursor:pointer;font-size:13.5px}
.btn:hover{background:#f1f6fa}
.btn:active{transform:translateY(1px)}
.btn.on{background:#16689c;border-color:#16689c;color:#fff}
#tabs{display:flex;gap:7px;padding:0 14px 10px;flex-wrap:wrap;align-items:center}
#tabs .lbl{font-size:12px;color:#6a7a89}
#tabs .sep{width:1px;height:20px;background:#dde4ea;margin:0 4px}
#tabs .tip{font-size:11.5px;color:#8b9aa8}
.tab{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid #cfd8e0;
  background:#fff;cursor:pointer;font-size:13.5px;transition:.15s;user-select:none}
.tab:hover{border-color:#9fb6c9}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--c,#8aa)}
.tab .n{font-size:11.5px;color:#7b8b99}
.tab.on{background:var(--cb,#16689c);border-color:var(--cb,#16689c);color:#fff;font-weight:600}
.tab.on .n{color:rgba(255,255,255,.82)}

/* ---------- 地图舞台 ---------- */
#stage{position:relative;flex:1 1 auto;overflow:hidden;background:#eef2f6;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dot{fill:#fff;stroke:#33414d;stroke-width:1.4}
.dot.tf{stroke:#12202c;stroke-width:2.4}
#dots.dim{opacity:.22}
#lines,#dots,#rings,#labels{pointer-events:none}
.hit{fill:transparent;pointer-events:auto;cursor:pointer}
.ring{fill:none;stroke:var(--c,#e05a3d);stroke-width:2.8}
.lbl text{font-size:11px;fill:#2a3a48;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:2.6px;stroke-linejoin:round;dominant-baseline:middle}
.lbl text.key{font-weight:700;fill:#0d2b3e;font-size:12px}
.lbl .off{display:none}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  min-width:19px;height:19px;padding:0 5px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--c,#e05a3d);color:#fff;font-size:11.5px;font-weight:700;line-height:1;
  border:1.5px solid #fff;box-shadow:0 2px 6px rgba(10,30,50,.35);transition:.12s}
.badge:hover{transform:translate(-50%,-50%) scale(1.22)}
.badge.on{outline:2.5px solid #16689c;outline-offset:1px}
.legend{position:absolute;left:12px;bottom:34px;max-width:52vw;padding:8px 10px;border-radius:11px;
  background:rgba(255,255,255,.9);border:1px solid #dde4ea;font-size:11.5px;line-height:1.5;
  display:flex;flex-wrap:wrap;gap:2px 10px;z-index:5}
.legend i{display:inline-flex;align-items:center;gap:4px;font-style:normal;color:#4b5b69}
.legend i b{width:15px;height:4px;border-radius:2px;background:var(--c)}
.dnote{position:absolute;left:12px;top:10px;max-width:min(70vw,620px);padding:6px 10px;border-radius:8px;font-size:11.5px;
  background:rgba(255,247,225,.95);border:1px solid #f0d9a6;color:#7a5a12;z-index:6;display:none;line-height:1.5}
.dnote.show{display:block}
.note,.hint{position:absolute;bottom:9px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.86);
  border:1px solid #dde4ea;font-size:11px;color:#5d6d7b;z-index:5;line-height:1.5}
.hint{right:12px}
.note{left:12px;max-width:52vw}
.ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:6}
.ctl button{width:36px;height:34px;border-radius:9px;border:1px solid #cfd8e0;background:#fff;cursor:pointer;font-size:17px;line-height:1}
.ctl button:hover{background:#f1f6fa}

/* ---------- 气泡 ---------- */
.bubble{position:absolute;z-index:9;pointer-events:auto;width:264px;max-width:76vw;background:#fff;
  border-radius:13px;border:1px solid #d7dfe6;box-shadow:0 14px 34px rgba(15,40,65,.22);animation:pop .15s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.bubble .tail{position:absolute;width:13px;height:13px;background:#fff;border-left:1px solid #d7dfe6;border-top:1px solid #d7dfe6}
.bubble h3{margin:0;padding:11px 32px 9px 13px;font-size:15px;border-bottom:1px solid #eef2f5;line-height:1.35;border-radius:13px 13px 0 0}
.bubble h3 span{display:block;font-size:11px;font-weight:400;color:#77899a;margin-top:2px}
.bubble .x{position:absolute;right:8px;top:8px;width:22px;height:22px;border:0;border-radius:6px;background:#f1f4f7;
  cursor:pointer;font-size:14px;line-height:1;color:#5d6d7b}
.bubble .x:hover{background:#e3e9ef}
.lines{display:flex;gap:4px;flex-wrap:wrap;padding:8px 13px 0}
.lines b{font-size:10.5px;font-weight:600;color:#fff;background:var(--c);border-radius:4px;padding:1px 5px}
.bubble ul{margin:0;padding:9px 13px 12px;list-style:none;max-height:min(44vh,320px);overflow:auto}
.bubble li{padding:8px 0;border-top:1px dashed #e8edf1}
.bubble li:first-child{border-top:0;padding-top:2px}
.bubble li>a{display:block;color:#0f62a8;text-decoration:none;font-size:14px;font-weight:600;line-height:1.4;word-break:break-all}
.bubble li>a:hover{text-decoration:underline}
.meta{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:11.5px;color:#6a7a89;flex-wrap:wrap}
.meta .p{color:#c2540a;font-weight:700}
.meta .s{background:#f1f4f7;border-radius:4px;padding:1px 6px;color:#546778}
.pprice{display:inline-flex;align-items:center;gap:4px;border:1px solid #cfe0ee;background:#f2f8fd;color:#0f62a8;
  border-radius:5px;padding:1px 8px;font-size:11.5px;cursor:pointer;font-weight:600}
.pprice:hover{background:#e4f1fb}
.pprice i{font-style:normal;font-size:9px;transition:.15s}
.pdetail{display:flex;gap:12px;margin-top:6px;padding:7px 10px;background:#f7fafc;border:1px solid #eaf0f4;border-radius:8px;flex-wrap:wrap}
.pdetail[hidden]{display:none}
.pd{display:inline-flex;align-items:baseline;gap:4px;font-size:11.5px;color:#8494a2}
.pd em{font-style:normal}
.pd b{font-size:13.5px;color:var(--c)}
.pd.hi{color:#0d2b3e}
.pd.hi em{font-weight:700}
.empty{padding:14px 13px;font-size:13px;color:#77899a}
</style>
</head>
<body>

<div id="gate">
  <svg class="gateArt" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke-linecap="round" stroke-width="7">
      <path d="M-20 90 H210 L280 160 H640" stroke="#c23a30" opacity=".55"/>
      <path d="M-20 250 H150 L230 170 H640" stroke="#008e9c" opacity=".5"/>
      <path d="M120 -20 V140 L200 220 V420" stroke="#009b6b" opacity=".45"/>
      <path d="M470 -20 V150 L390 230 H-20" stroke="#d29700" opacity=".45"/>
      <path d="M640 330 H320 L250 260" stroke="#5b2c68" opacity=".5"/>
    </g>
    <g fill="#0b1f33" stroke="#dceaf6" stroke-width="3">
      <circle cx="210" cy="90" r="7"/><circle cx="280" cy="160" r="7"/><circle cx="150" cy="250" r="7"/>
      <circle cx="230" cy="170" r="7"/><circle cx="200" cy="220" r="7"/><circle cx="390" cy="230" r="7"/>
    </g>
  </svg>
  <form class="card" id="gateForm" autocomplete="off">
    <h1>北京地铁美食地图</h1>
    <p class="sub">本页为内部使用的美食地图，需输入访问密码进入。</p>
    <input type="password" id="pw" placeholder="请输入访问密码" aria-label="访问密码">
    <div id="gateErr"></div>
    <button type="submit">进入地图</button>
    <p class="lockNote">静态页面的密码只是一道访问门槛，防不住直接看源码的人；请勿在数据集里放真正的敏感信息。</p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="topRow">
      <div class="brand">北京地铁美食地图<span id="sum"></span></div>
      <div class="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="search" list="stList" placeholder="搜索站点，如 国贸" autocomplete="off">
        <datalist id="stList"></datalist>
      </div>
      <button class="btn" id="btnFit">全图</button>
      <button class="btn" id="btnFood">只看有店</button>
    </div>
    <nav id="tabs"></nav>
  </header>

  <main id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <g id="view">
        <g id="lines"></g>
        <g id="dots"></g>
        <g id="rings"></g>
        <g id="hits"></g>
      </g>
      <g id="labels" class="lbl"></g>
    </svg>
    <div id="overlay"></div>
    <div class="ctl">
      <button id="zin" title="放大">+</button>
      <button id="zout" title="缩小">−</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="dnote" id="dataNote"></div>
    <div class="note" id="note"></div>
    <div class="hint">拖动平移 · 滚轮/双指缩放 · 双击放大 · 点站点看美食</div>
  </main>
</div>

  "sina.cn": "新浪", "google.com": "Google", "dianping.cn": "大众点评", "kudo.qq.com": "京东", "maimai.cn": "脉脉" };
function shortLink(url) {
  let u; try { u = new URL(url); } catch (e) { return { url: "#", label: "链接无效" }; }
  const host = u.hostname.replace(/^www\./, "");
  const known = Object.keys(HOSTCN).find((h) => host === h || host.endsWith("." + h));
  const seg = decodeURIComponent(u.pathname.split("/").filter(Boolean).pop() || u.search.slice(1, 9) || "");
  const tail = seg.replace(/\.(html?|php|aspx?)$/i, "").slice(0, 12);
  return { url: u.href, label: (known ? HOSTCN[known] : host) + (tail ? " · " + tail : "") };
}
const priceNum = (v) => { const n = Number(String(v == null ? "" : v).replace(/[^\d.]/g, "")); return Number.isFinite(n) && n > 0 ? n : null; };
const typeMap = new Map(PTYPES.map((t) => [t.key, t]));
const bucketOf = (tk, p) => { const bs = typeMap.get(tk).buckets; return (bs.find((b) => p >= b.min && p < b.max) || bs[bs.length - 1]).key; };
const bucketOf2 = (tk, p) => typeMap.get(tk).buckets.find((b) => p >= b.min && p < b.max) || typeMap.get(tk).buckets.slice(-1)[0];

let items = [], unmatched = [];
const foodByStation = new Map();
function buildIndex(rows) {
  items = []; unmatched = []; foodByStation.clear();
  (rows || []).forEach((f) => {

    const pr = {};
    PTYPES.forEach((t) => { pr[t.key] = priceNum(f[t.key] != null ? f[t.key] : f[t.label]); });
    items.push({ station: s ? s.id : null, raw: f, title: f.title || "(未命名)", link: shortLink(f.url), pr });
    if (!s) unmatched.push(f.station);
  });
  items.forEach((it) => { if (it.station) { if (!foodByStation.has(it.station)) foodByStation.set(it.station, []); foodByStation.get(it.station).push(it); } });
}

/* 与构建脚本同一套列探测规则（"地铁站名称"和"美食标题"都含"名称"，已占用的列不复用） */
function parseFoodCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  const sep = text.includes("\t") && !/^\s*[^"\t]+,[^"\t]+,/m.test(text) ? "\t" : ",";
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  const clean = rows.map((r) => r.map((x) => x.trim())).filter((r) => r.some((x) => x));
  if (!clean.length) return [];
  const head = clean[0].map((h) => h.toLowerCase());
  const used = new Set();
  const pick = (...keys) => {
    for (const k of keys) { const i = head.findIndex((h, idx) => !used.has(idx) && h && h.includes(k)); if (i >= 0) { used.add(i); return i; } }
    return -1;
  };
  let iS = pick("地铁站", "站名", "站点", "station");
  let iU = pick("网址", "链接", "url", "link", "href");
  let i1 = pick("单次", "一次", "散客", "once");
  let i2 = pick("包时", "小时", "计时", "hour");
  let i3 = pick("包夜", "通宵", "night");
  let iT = pick("标题", "美食", "名称", "店名", "title", "name", "dish");
  const hasHeader = iS >= 0 && iU >= 0;
  if (!hasHeader) { iS = 0; iT = 1; iU = 2; i1 = 3; i2 = 4; i3 = 5; }
  return (hasHeader ? clean.slice(1) : clean).map((r) => ({ station: r[iS], title: iT >= 0 ? r[iT] : r[iS], url: r[iU],
    once: i1 >= 0 ? r[i1] : "", hour: i2 >= 0 ? r[i2] : "", night: i3 >= 0 ? r[i3] : "" })).filter((o) => o.station);
}

/* 运行时读取数据集：在仓库里覆盖 food.csv 即可更新页面，不需要重新构建 */
async function loadData() {
  const note = $("dataNote");
  const setNote = (msg) => { note.textContent = msg || ""; note.classList.toggle("show", !!msg); };
  let rows = null, how = "内联兜底";
  try {
    const res = await fetch(META.dataFile + "?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const txt = (await res.text()).replace(/^﻿/, "");
      rows = /^\s*[\[{]/.test(txt) ? JSON.parse(txt) : parseFoodCsv(txt);
      how = META.dataFile;
    } else setNote(`数据集 ${META.dataFile} 读取失败（HTTP ${res.status}），暂用页面内置副本`);
  } catch (e) {
    setNote(`未能读取 ${META.dataFile}（${location.protocol === "file:" ? "本地 file:// 打开不支持" : e.message}），当前显示页面内置副本`);
  }
  if (rows) buildIndex(rows.length ? rows : FOOD);
  closeBubble();
  if (state.ptype !== "all" && !items.some((i) => i.pr[state.ptype] != null)) { state.ptype = "all"; state.range = "all"; }
  rebuildTabs(); renderFood();
  const bad = [...new Set(unmatched)];
  if (bad.length) setNote(`注意：${bad.length} 个站名没匹配到地铁图上的站点 → ${bad.slice(0, 6).join("、")}${bad.length > 6 ? " …" : ""}`);
  else if (rows) setNote(`数据集已载入：${items.length} 条（来源 ${how}）`);
  console.log("[data]", how, items.length, "条；未匹配站名:", bad);
}

const mctx = document.createElement("canvas").getContext("2d");
mctx.font = "11px 'PingFang SC','Microsoft YaHei',sans-serif";

function buildMap() {
  const gL = $("lines"), gD = $("dots"), gH = $("hits"), gB = $("labels");
  const segs = new Map();
  MAP.edges.forEach((e) => {
    const d = "M" + e.p.map((v, i) => (i === 0 ? "" : i % 2 ? " " : "L") + v.toFixed(1)).join("");
    if (!segs.has(e.l)) segs.set(e.l, []); segs.get(e.l).push(d);
  });
  MAP.lines.forEach((l) => {
    if (!segs.has(l.id)) return;
    mk("path", { d: segs.get(l.id).join(""), fill: "none", stroke: l.color, "stroke-width": 4.6,
      "stroke-linecap": "round", "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke", "stroke-opacity": 0.9 }, gL);
  });
  MAP.stations.forEach((s) => {
    const dot = mk("circle", { class: "dot" + (s.tf ? " tf" : ""), r: s.tf ? 4.6 : 2.9,
      "vector-effect": "non-scaling-stroke" }, gD);
    dot.setAttribute("transform", `translate(${s.x},${s.y})`);
    const hit = mk("circle", { class: "hit", r: 9 }, gH);
    hit.__s = s; hit.setAttribute("transform", `translate(${s.x},${s.y})`);
    screenEls.push({ el: dot, x: s.x, y: s.y }, { el: hit, x: s.x, y: s.y });

/* ============ 视角 ============ */
const fitScale = () => Math.min((stage.clientWidth - 52) / VB.w, (stage.clientHeight - 52) / VB.h);
const minK = () => fitScale() * 0.55, maxK = () => fitScale() * 14;
function setView(k, tx, ty) {
  state.k = k; state.tx = tx; state.ty = ty;
  view.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`);
  requestDraw();
}
function centerView() { const k = fitScale(); setView(k, (stage.clientWidth - VB.w * k) / 2 - VB.x * k, (stage.clientHeight - VB.h * k) / 2 - VB.y * k); }
function toScreen(x, y) { return [x * state.k + state.tx, y * state.k + state.ty]; }

  const k2 = Math.max(minK(), Math.min(maxK(), k));

function zoomAt(px, py, f) { zoomAbs(px, py, state.k * f, state.tx, state.ty); }

/* ============ 过滤 / 徽标 ============ */
// 两行标签：先选价格类型（全部/单次/包时/包夜），再选该类型的区间
const priceOf = (it) => (state.ptype === "all" ? null : it.pr[state.ptype]);
function match(it) {
  if (state.ptype === "all") return true;
  const p = it.pr[state.ptype];
  if (p == null) return false;

}
const activeFor = (id) => { const a = foodByStation.get(id); if (!a) return null; const f = a.filter(match); return f.length ? f : null; };
const colorOf = (it) => (state.ptype === "all" ? "#e05a3d" : (bucketOf2(state.ptype, it.pr[state.ptype]) || {}).color);

function tab(label, count, color, on, onclick, extra) {

}
function buildTabs() {

  else {

const lab = (t, cls) => { const s = document.createElement("span"); s.className = "lbl" + (cls ? " " + cls : ""); s.textContent = t; return s; };
function syncTabs() { [...$("tabs").querySelectorAll(".tab")].forEach((el) => el.classList.toggle("on", el.__on && el.__on())); }
function rebuildTabs() { buildTabs(); }

function renderFood() {
  const keep = [];
  foodByStation.forEach((_, id) => { if (activeFor(id)) keep.push(id); });
  const keepSet = new Set(keep);
  keep.forEach((id) => {
    const s = stById.get(id), list = activeFor(id);
    const cols = [...new Set(list.map(colorOf))];
    const color = state.ptype === "all" ? "#e05a3d" : (cols.length === 1 ? cols[0] : "#c0272b");
    let b = badgeEls.get(id);
    if (!b) { b = document.createElement("div"); b.className = "badge";
      b.onclick = (e) => { e.stopPropagation(); select(s); };
      b.addEventListener("pointerdown", (e) => e.stopPropagation());
      overlay.appendChild(b); badgeEls.set(id, b); }
    b.textContent = list.length;
    b.style.setProperty("--c", color);
    b.title = `${s.name}：${list.length} 家美食`;
    let o = ringEls.get(id);
    if (!o) { o = { el: mk("circle", { class: "ring", r: 8.4, "vector-effect": "non-scaling-stroke" }, $("rings")), x: s.x, y: s.y };
      o.el.style.setProperty("--c", color); $("rings").appendChild(o.el); ringEls.set(id, o); }
    o.el.style.setProperty("--c", color);
  });
  badgeEls.forEach((b, id) => { if (!keepSet.has(id)) { b.remove(); badgeEls.delete(id); } });
  ringEls.forEach((o, id) => { if (!keepSet.has(id)) { o.el.remove(); ringEls.delete(id); } });
  $("dots").classList.toggle("dim", state.foodOnly);
  const shown = keep.reduce((a, id) => a + activeFor(id).length, 0);
  const bk = state.ptype === "all" ? null : typeMap.get(state.ptype).buckets.find((b) => b.key === state.range);
  const filt = state.ptype === "all" ? "" : " · " + typeMap.get(state.ptype).label + (bk ? " " + bk.label : "");
  $("sum").textContent = `${MAP.stations.length} 座车站 · 收录 ${items.filter((i) => i.station).length} 条美食`
    + filt + ` · 当前 ${shown} 条 / ${keep.length} 站`;
  if (state.sel && !keepSet.has(state.sel)) closeBubble();

}

/* ============ 每帧绘制 ============ */
function requestDraw() { if (!raf) raf = requestAnimationFrame(draw); }
function draw() {
  raf = 0;
  const inv = 1 / state.k;
  if (Math.abs(inv - lastInv) > 0.015) {
    lastInv = inv;
    for (const o of screenEls) o.el.setAttribute("transform", `translate(${o.x},${o.y}) scale(${inv})`);
    ringEls.forEach((o) => o.el.setAttribute("transform", `translate(${o.x},${o.y}) scale(${inv})`));
  }
  badgeEls.forEach((b, id) => {
    const s = stById.get(id), [x, y] = toScreen(s.x, s.y);
    const off = x < -40 || y < -40 || x > stage.clientWidth + 40 || y > stage.clientHeight + 40;
    b.style.display = off ? "none" : "";
    b.style.left = x + 9 + "px"; b.style.top = y - 10 + "px";
  });
  placeLabels();
  if (bubbleEl) positionBubble(bubbleEl.__s);
}

function placeLabels() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const showAll = !state.foodOnly && state.k > fitScale() * 2.3;
  const cands = [];
  for (const L of labelEls) {
    const [x, y] = toScreen(L.s.x, L.s.y);
    if (x < 30 || y < 14 || x > W - 30 || y > H - 14) continue;
    const food = !!activeFor(L.s.id);
    if (!food && !showAll && !L.s.tf) continue;
    cands.push({ L, x, y, w: Math.max(L.w, food ? L.w + 16 : L.w),
      pr: (food ? 3000 : L.s.tf ? 800 : 100) - Math.hypot(x - W / 2, y - H / 2) / 900 });
  }
  cands.sort((a, b) => b.pr - a.pr);
  const placed = [];
  const hit = (X, Y, Wd, Ht) => {
    if (X < 2 || Y < 2 || X + Wd > W - 2 || Y + Ht > H - 2) return false;
    for (const r of placed) if (X < r.x + r.w && X + Wd > r.x && Y < r.y + r.h && Y + Ht > r.y) return false;
    return true;
  };
  const taken = new Set();
  for (const c of cands) {
    const Ht = 14;
    const tries = [[c.x + 8, c.y - 7], [c.x - c.w - 8, c.y - 7], [c.x - c.w / 2, c.y + 9], [c.x - c.w / 2, c.y - 21]];
    for (const t of tries) {
      if (!hit(t[0], t[1], c.w, Ht)) continue;
      placed.push({ x: t[0] - 2, y: t[1] - 2, w: c.w + 4, h: Ht + 4 });
      c.L.el.setAttribute("transform", `translate(${t[0]},${t[1]})`);
      c.L.el.classList.remove("off"); c.L.el.classList.toggle("key", !!activeFor(c.L.s.id));
      taken.add(c.L); break;
    }
  }
  labelEls.forEach((L) => { if (!taken.has(L)) L.el.classList.add("off"); });
}

/* ============ 气泡 ============ */
let bubbleEl = null;

    : `<ul>${list.map((it) => `<li><a href="${esc(it.link.url)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>
        <div class="meta"><button class="pprice" type="button" aria-expanded="false">${
          state.ptype === "all" ? "价格" : typeMap.get(state.ptype).label + " ¥" + (it.pr[state.ptype] == null ? "—" : it.pr[state.ptype])
        }<i>▾</i></button><span class="s">${esc(it.link.label)}</span></div>
        <div class="pdetail" hidden>${PTYPES.map((t) => `<span class="pd${t.key === state.ptype ? " hi" : ""}"><em>${t.label}</em><b style="--c:${t.color}">${it.pr[t.key] == null ? "—" : "¥" + it.pr[t.key]}</b></span>`).join("")}</div>
      </li>`).join("")}</ul>`;
  const el = document.createElement("div");

    + `<h3>${esc(s.name)}<span>${esc(s.en || "")}</span></h3><div class="lines">${chips}</div>${body}`;
  el.__s = s;
  el.addEventListener("pointerdown", (e) => e.stopPropagation());
  el.querySelector(".x").onclick = (e) => { e.stopPropagation(); closeBubble(); };
  el.querySelectorAll(".pprice").forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const d = btn.closest("li").querySelector(".pdetail");
      const open = d.hasAttribute("hidden");
      if (open) d.removeAttribute("hidden"); else d.setAttribute("hidden", "");
      btn.setAttribute("aria-expanded", String(open));
      btn.querySelector("i").style.transform = open ? "rotate(180deg)" : "";
      positionBubble(s);
    };
  });
  overlay.appendChild(el);
  bubbleEl = el;
  positionBubble(s);
}
function positionBubble(s) {
  const el = bubbleEl; if (!el) return;
  const [x, y] = toScreen(s.x, s.y), W = stage.clientWidth, H = stage.clientHeight;
  const bw = el.offsetWidth, bh = el.offsetHeight;
  let left = x + 18, top = y - bh / 2, side = "left";
  if (left + bw > W - 10) { left = x - bw - 18; side = "right"; }
  if (left < 8) { left = Math.min(Math.max(8, x - bw / 2), W - bw - 8); top = y - bh - 16; side = "bottom"; }
  if (top < 8) { if (side === "left" || side === "right") { top = y + 18; } else top = 8; }
  if (top + bh > H - 8) top = Math.max(8, H - bh - 8);
  el.style.left = left + "px"; el.style.top = top + "px";
  const t = el.querySelector(".tail");
  t.style.left = t.style.right = "auto";
  if (side === "left") { t.style.left = "-7px"; t.style.top = Math.min(Math.max(y - top, 16), bh - 20) + "px"; t.style.transform = "rotate(-45deg)"; }
  else if (side === "right") { t.style.right = "-7px"; t.style.top = Math.min(Math.max(y - top, 16), bh - 20) + "px"; t.style.transform = "rotate(135deg)"; }
  else { t.style.left = Math.min(Math.max(x - left, 20), bw - 24) + "px"; t.style.top = "-7px"; t.style.transform = "rotate(45deg)"; }
}

/* ============ 手势 ============ */
const ptrs = new Map();
let pan = null, pinch = null, moved = 0;
const local = (e) => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
stage.addEventListener("pointerdown", (e) => {
  const p = local(e); ptrs.set(e.pointerId, p); moved = 0;
  if (ptrs.size === 1) { pan = { sx: p[0], sy: p[1], lx: p[0], ly: p[1], tx: state.tx, ty: state.ty }; stage.classList.add("drag"); }
  else if (ptrs.size === 2) { const a = [...ptrs.values()];
    pinch = { d: Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) || 1, cx: (a[0][0] + a[1][0]) / 2, cy: (a[0][1] + a[1][1]) / 2 }; }
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});
stage.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const p = local(e); ptrs.set(e.pointerId, p);
  if (pinch && ptrs.size >= 2) {
    const a = [...ptrs.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
    zoomAbs(pinch.cx, pinch.cy, state.k * (d / pinch.d), state.tx, state.ty);
    pinch.d = d; moved += 8; return;
  }
  if (pan) {
    moved += Math.hypot(p[0] - pan.lx, p[1] - pan.ly);
    setView(state.k, pan.tx + (p[0] - pan.sx), pan.ty + (p[1] - pan.sy));
    pan.lx = p[0]; pan.ly = p[1];
  }
});
// 就近命中：比精确点中 r=9 的热区更好点，也不会被 setPointerCapture 改写事件目标
function pickStation(px, py) {
  let best = null, bd = 16;
  for (const s of MAP.stations) {
    const [x, y] = toScreen(s.x, s.y);
    const d = Math.hypot(x - px, y - py);
    const lim = Math.max(bd, s.tf ? 18 : 14);
    if (d < lim && (!best || d < best.d)) best = { s, d };
  }
  return best ? best.s : null;
}
const endPtr = (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) {
    if (pan && moved <= 8) { const [x, y] = local(e); const s = pickStation(x, y); if (s) select(s); else closeBubble(); }
    pan = null; stage.classList.remove("drag");
  }
};
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);
stage.addEventListener("wheel", (e) => { e.preventDefault(); const [x, y] = local(e); zoomAt(x, y, Math.pow(1.0016, -e.deltaY * (e.deltaMode === 1 ? 16 : 1))); }, { passive: false });
stage.addEventListener("dblclick", (e) => { const [x, y] = local(e); zoomAt(x, y, 1.8); });
$("zin").onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.6);
$("zout").onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.6);
$("btnFit").onclick = () => { closeBubble(); centerView(); };
$("btnFood").onclick = () => { state.foodOnly = !state.foodOnly; $("btnFood").classList.toggle("on", state.foodOnly); lastInv = -1; requestDraw(); };
window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeBubble(); });
window.addEventListener("resize", requestDraw);

/* ============ 搜索 ============ */
function initSearch() {
  const dl = $("stList"), inp = $("search");
  MAP.stations.forEach((s) => { const o = document.createElement("option"); o.value = s.name; dl.appendChild(o); });
  const jump = () => { const s = MAP.stations.find((x) => x.name === inp.value.trim()); if (s) { inp.blur(); goTo(s); } };
  inp.addEventListener("change", jump);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); jump(); } });
}

/* ============ 深链 /?station=国贸&filter=b2&zoom=3 ============ */
function applyQuery() {
  const q = new URLSearchParams(location.search);
  const tp = q.get("type"), rg = q.get("range");
  if (tp && (tp === "all" || typeMap.has(tp))) {
    state.ptype = tp;
    state.range = rg && typeMap.has(tp) && typeMap.get(tp).buckets.some((b) => b.key === rg) ? rg : "all";
    syncTabs();
  }
  if (q.get("foodonly") === "1") { state.foodOnly = true; $("btnFood").classList.add("on"); }
  const z = Number(q.get("zoom"));
  if (z) { const k = fitScale() * z; setView(k, stage.clientWidth / 2 - (VB.x + VB.w / 2) * k, stage.clientHeight / 2 - (VB.y + VB.h / 2) * k); }
  const name = q.get("station");
  if (name) { const s = findStation(name); if (s) { const kk = Math.max(state.k, fitScale() * 3.2); setView(kk, stage.clientWidth / 2 - s.x * kk, stage.clientHeight / 2 - s.y * kk); select(s); } else console.warn("deep-link 站点未找到:", name); }
}

/* ============ 启动 ============ */
function boot() {
  buildMap();
  $("legend").innerHTML = MAP.lines.filter((l) => l.id !== "other" && l.id !== "np")
    .map((l) => `<i><b style="--c:${l.color}"></b>${esc(l.name)}</i>`).join("");
  $("note").textContent = META.note;
  buildTabs(); initSearch(); centerView(); applyQuery(); renderFood(); loadData();
  if (unmatched.length) console.warn("以下站名没能匹配到地铁图上的站点：", [...new Set(unmatched)]);
}
gateInit();
</script>
</body>
